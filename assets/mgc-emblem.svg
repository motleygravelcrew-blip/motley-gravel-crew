<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc"><title id="title">Motley Gravel Crew emblem</title><desc id="desc">MGC initials with cyan-blue M, white G and purple-magenta C, mountain outline and gravel road inside a gradient circular ring.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d8f5"/><stop offset=".52" stop-color="#246bff"/><stop offset="1" stop-color="#c000ff"/></linearGradient><linearGradient id="road" x1="0" y1="0" x2="1" y2=".2"><stop offset="0" stop-color="#00d8f5"/><stop offset=".55" stop-color="#246bff"/><stop offset="1" stop-color="#d000ff"/></linearGradient></defs><rect width="512" height="512" rx="42" fill="#050718"/><path d="M58 255A198 198 0 0 1 454 255" fill="none" stroke="url(#g)" stroke-width="15" stroke-linecap="round"/><path d="M116 221 190 174 219 190 278 146 322 184 365 169 414 221" fill="none" stroke="url(#g)" stroke-width="9" stroke-linejoin="round"/><text x="45" y="330" font-family="Arial Black,Arial,sans-serif" font-size="170" font-style="italic" font-weight="900" letter-spacing="-16" fill="url(#g)">M</text><text x="210" y="330" font-family="Arial Black,Arial,sans-serif" font-size="170" font-style="italic" font-weight="900" letter-spacing="-12" fill="#fff">G</text><text x="335" y="330" font-family="Arial Black,Arial,sans-serif" font-size="170" font-style="italic" font-weight="900" letter-spacing="-12" fill="url(#g)">C</text><path d="M78 358Q175 430 270 385T435 355Q382 430 302 456Q198 493 110 416" fill="none" stroke="url(#road)" stroke-width="19" stroke-linecap="round"/><g fill="url(#road)"><circle cx="160" cy="411" r="6"/><circle cx="184" cy="424" r="5"/><circle cx="213" cy="433" r="7"/><circle cx="244" cy="438" r="5"/><circle cx="277" cy="435" r="7"/><circle cx="309" cy="424" r="5"/><circle cx="338" cy="409" r="6"/></g></svg>