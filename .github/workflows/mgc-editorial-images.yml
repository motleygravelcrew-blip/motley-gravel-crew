name: MGC automatic editorial image discovery

on:
  push:
    branches: [main]
    paths:
      - '20??-??-??.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mgc-editorial-images
  cancel-in-progress: false

jobs:
  discover-and-publish-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest edition
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Discover, verify and download licensed images
        run: python3 scripts/discover_editorial_images.py
      - name: Commit approved image assets and article placements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/editorial 20??-??-??.html
          if git diff --cached --quiet; then
            echo "No images passed the automated checks; no image changes to publish."
          else
            git commit -m "Add automatically verified editorial images"
            git push origin main
          fi
