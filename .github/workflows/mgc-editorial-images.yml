name: MGC editorial image discovery (manual maintenance only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Discover candidates without publishing
        run: |
          python3 scripts/discover_editorial_images.py
          git status --short
          echo "This legacy workflow is report-only. It cannot commit or deploy image changes."
