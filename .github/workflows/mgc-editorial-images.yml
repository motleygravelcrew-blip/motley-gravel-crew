name: MGC editorial image discovery (manual review only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-for-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved content
        uses: actions/checkout@v4
      - name: Discover and validate candidate images
        run: python3 scripts/discover_editorial_images.py
      - name: Report candidate changes without publishing
        run: |
          if git status --short; then
            echo "Any generated image or article changes are review candidates only."
            echo "This workflow has read-only repository permissions and cannot publish them."
          fi
