name: Update MGC RSS feed (manual maintenance only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate RSS feed
        run: |
          python3 scripts/build_rss_feed.py
          python3 - <<'PY'
          from xml.etree import ElementTree as ET
          ET.parse('feed.xml')
          print('RSS feed XML is valid.')
          PY
