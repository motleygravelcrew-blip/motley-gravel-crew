name: Update MGC RSS feed

on:
  push:
    branches: [main]
    paths:
      - '20??-??-??.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mgc-rss-feed
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Build RSS feed from dated editions
        run: python3 scripts/build_rss_feed.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "RSS feed is already current."
          else
            git commit -m "Update MGC RSS feed"
            git push origin main
          fi
